name: keepalive
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "apikey: ${{ secrets.SUPA_KEY }}" \
            "https://mauvcvrxmhxvwtbwyvif.supabase.co/rest/v1/kv?select=key&limit=1"
