<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens Rail — shot list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#DFE2DC; --slip:#F1F2ED; --ink:#14181A; --steel:#79837E;
    --hair:#C3C8C0; --brass:#A2761F; --bottle:#1D3A32; --flag:#8C3218;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Oswald","Arial Narrow",system-ui,sans-serif;
    --chipbg:#FFFFFF;
  }
  body.dark{
    --paper:#101214; --slip:#181C1E; --ink:#E7EAE5; --steel:#8A948E;
    --hair:#33393B; --brass:#C29036; --bottle:#8FB3A5; --flag:#C4643F;
    --chipbg:#22272A;
  }
  body.dark .frame{background:#0C0F10}
  body.dark .tab.on{background:var(--slip)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 92px}

  header.mast{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:12px}
  .mast h1{font-family:var(--disp);font-weight:600;font-size:32px;line-height:.9;text-transform:uppercase;letter-spacing:.03em;margin:0}
  .mast h1 span{color:var(--brass)}
  .tagline{font-size:10px;color:var(--steel);letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
  .mast .spacer{flex:1}
  .slate{display:flex;gap:14px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  input,select,textarea{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--slip);border:1px solid var(--hair);border-radius:0;padding:5px 7px;min-width:0}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  input[type=checkbox]{accent-color:var(--bottle);width:16px;height:16px}
  input[type=range]{accent-color:var(--bottle);padding:0}
  button{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--ink);color:var(--ink);padding:6px 11px;cursor:pointer}
  button:hover{background:var(--ink);color:var(--paper)}
  button.ghost{border-color:var(--hair);color:var(--steel)}
  button.ghost:hover{background:var(--steel);color:var(--slip);border-color:var(--steel)}

  .projbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 0;border-bottom:1px solid var(--hair);margin-bottom:4px}
  .projbar select{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px;padding:5px 8px}
  .live{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bottle)}
  .live .pip{width:7px;height:7px;border-radius:50%;background:var(--brass)}
  .live.off{color:var(--steel)} .live.off .pip{background:var(--hair)}

  .rail-shell{margin:18px 0 6px;padding:16px 6px 4px;border:1px solid var(--hair);background:var(--slip)}
  .rail-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 12px 10px;gap:12px;flex-wrap:wrap}
  .rail-head h2{font-family:var(--disp);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:12px;margin:0;color:var(--bottle)}
  .rail-note{font-size:11px;color:var(--steel)} .rail-note b{color:var(--flag);font-weight:600}
  .rail{position:relative;height:74px;margin:0 22px}
  .rail-line{position:absolute;left:0;right:0;top:44px;height:1px;background:var(--ink)}
  .tick{position:absolute;top:44px;width:1px;height:6px;background:var(--steel)}
  .tick span{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--steel)}
  .stop{position:absolute;top:44px;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
  .stop .dot{border-radius:50%;background:var(--bottle);border:1px solid var(--bottle);transition:transform .12s ease}
  .stop:hover .dot{transform:scale(1.18)} .stop:hover{background:none}
  .stop.on .dot{background:var(--brass);border-color:var(--brass)}
  .stop.dim .dot{background:none}
  .stop .mm{position:absolute;bottom:calc(50% + 12px);font-family:var(--disp);font-size:14px;font-weight:500;white-space:nowrap}
  .stop .ct{position:absolute;bottom:calc(50% + 28px);font-size:9px;color:var(--steel);letter-spacing:.1em}

  .tabs{display:flex;flex-wrap:wrap;margin-top:22px;border-bottom:1px solid var(--ink)}
  .tab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:500;padding:8px 14px;border:1px solid var(--hair);border-bottom:0;background:none;margin-right:-1px;color:var(--steel);cursor:pointer;position:relative;top:1px}
  .tab:hover{background:none;color:var(--ink)}
  .tab.on{background:var(--slip);border-color:var(--ink);color:var(--ink)}
  .tab .n{font-family:var(--mono);font-size:10px;color:var(--steel);margin-left:7px}
  .tab.add{border-style:dashed;color:var(--brass)}

  .scene-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0;position:sticky;top:0;background:var(--paper);z-index:4}
  .scene-bar input.name{font-family:var(--disp);font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;flex:1;min-width:200px;background:none;border:0;border-bottom:1px solid var(--hair)}
  .scene-bar input.name:focus{background:var(--slip)}
  .modes{display:flex}
  .modes button{border-right-width:0} .modes button:last-child{border-right-width:1px}
  .modes button.on{background:var(--ink);color:var(--paper)}

  .slip{background:var(--slip);border:1px solid var(--hair);border-left:3px solid var(--bottle);margin-bottom:9px;padding:9px 11px}
  .slip.sel{border-color:var(--brass);border-left-color:var(--brass)}
  .slip.done{border-left-color:var(--brass);background:#EAEBE5}
  .slip.done .desc input{text-decoration:line-through;color:var(--steel)}
  .line1{display:grid;grid-template-columns:44px repeat(6,minmax(64px,1fr)) 96px 60px 60px;gap:8px;align-items:end}
  .line2{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .desc{flex:1;min-width:190px;display:flex;align-items:center;gap:8px}
  .desc input{flex:1;background:none;border:0;border-bottom:1px dotted var(--hair);font-size:13px;padding:3px 2px}
  .desc input:focus{background:var(--chipbg)}
  .slot{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--bottle)}
  .readout{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:10px;letter-spacing:.06em;border:1px solid var(--hair);padding:2px 6px;color:var(--bottle);background:var(--chipbg);white-space:nowrap}
  .chip.warn{border-color:var(--flag);color:var(--flag)}
  .row-tools{display:flex;gap:6px}
  .cams{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
  .cams .field input{width:62px}
  .cams .field.wide input{width:76px}
  .icon{border:1px solid var(--hair);color:var(--steel);padding:8px 11px;font-size:13px;line-height:1}
  .icon:hover{background:var(--flag);border-color:var(--flag);color:var(--slip)}
  .framewrap{display:flex;flex-direction:column;gap:3px;flex:none}
  .frame{width:186px;height:105px;border:1px solid var(--hair);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--steel);letter-spacing:.08em;text-align:center;overflow:hidden;padding:0}
  .frame img,.frame svg{width:100%;height:100%;object-fit:cover;display:block}
  .frame:hover{background:#fff;color:var(--brass);border-color:var(--brass)}
  .framewrap .mini{display:flex;gap:3px}
  .framewrap .mini button{flex:1;font-size:8.5px;padding:2px 0;border-color:var(--hair);color:var(--steel);letter-spacing:.04em}
  .framewrap .mini button:hover{background:var(--bottle);color:var(--slip);border-color:var(--bottle)}

  .lens-group{margin-bottom:22px}
  .lens-group h3{font-family:var(--disp);font-size:26px;font-weight:600;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .lens-group h3 small{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--steel);letter-spacing:.12em;text-transform:uppercase}
  .lens-group .aov{border-top:1px solid var(--ink);padding-top:6px;margin-bottom:8px}
  .lg-row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dotted var(--hair);flex-wrap:wrap}
  .lg-row .sc{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);min-width:130px}

  .plan-shell{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .palette{width:186px;flex:none}
  .palette h4{font-family:var(--disp);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);margin:12px 0 5px;font-weight:500}
  .palette h4:first-child{margin-top:0}
  .pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .pal-grid button{padding:6px 4px;font-size:10px;letter-spacing:.02em;text-transform:none;border-color:var(--hair);background:var(--slip)}
  .pal-grid button:hover{background:var(--bottle);border-color:var(--bottle);color:var(--slip)}
  .stage{flex:1;min-width:280px;border:1px solid var(--ink);background:var(--slip)}
  svg.plan{display:block;width:100%;height:auto;touch-action:none}
  .item{cursor:grab}
  .item.sel .hull{stroke:var(--brass);stroke-width:6}
  .inspector{width:210px;flex:none;border:1px solid var(--hair);background:var(--slip);padding:10px}
  .inspector h4{font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px;color:var(--bottle)}
  .inspector .field{margin-bottom:9px}
  .inspector input,.inspector select{width:100%}
  .legend{font-size:10px;color:var(--steel);margin-top:10px;line-height:1.7}
  .legend span{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}

  .stats{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:8px 18px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:11px;letter-spacing:.08em;z-index:5}
  .stats b{font-family:var(--disp);font-size:16px;font-weight:500;color:#fff;margin-right:5px}
  .stats .s{display:flex;align-items:baseline}
  .stats .push{margin-left:auto;display:flex;gap:8px}
  .stats button{border-color:var(--steel);color:var(--paper);font-size:10.5px;padding:5px 9px}
  .stats button:hover{background:var(--paper);color:var(--ink)}

  .empty{border:1px dashed var(--hair);padding:24px;text-align:center;color:var(--steel);background:var(--slip)}
  .empty p{margin:0 0 12px}
  .toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:var(--bottle);color:var(--slip);padding:8px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:40;max-width:90vw;text-align:center}
  .lightbox{position:fixed;inset:0;background:rgba(20,24,26,.92);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px;flex-direction:column;gap:12px}
  .lightbox img{max-width:100%;max-height:80vh;border:1px solid var(--steel)}
  .lightbox button{color:#DFE2DC;border-color:#79837E}

  /* storyboard composer */
  .board-modal{position:fixed;inset:0;background:rgba(20,24,26,.86);z-index:25;display:flex;align-items:center;justify-content:center;padding:16px}
  .board-box{background:var(--paper);border:2px solid var(--ink);max-width:1080px;width:100%;max-height:96vh;overflow:auto;padding:14px}
  .board-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .board-head h3{font-family:var(--disp);font-size:18px;text-transform:uppercase;letter-spacing:.1em;margin:0;font-weight:600}
  .board-head .spacer{flex:1}
  .board-body{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .board-pal{width:172px;flex:none;max-height:64vh;overflow:auto}
  .board-pal h4{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);margin:10px 0 5px;font-weight:500}
  .board-pal h4:first-child{margin-top:0}
  .thumb-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .thumb{border:1px solid var(--hair);background:#fff;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
  .thumb:hover{border-color:var(--brass);background:#fff}
  .thumb svg{width:100%;height:44px}
  .thumb i{font-style:normal;font-size:8.5px;color:var(--steel);letter-spacing:.04em}
  .board-stage{flex:1;min-width:300px;border:2px solid var(--ink);background:#fff}
  svg.board{display:block;width:100%;height:auto;touch-action:none}
  .b-item{cursor:grab}
  .b-item.sel .b-hull{stroke:var(--brass);stroke-width:3;fill:none}
  .board-insp{width:190px;flex:none;border:1px solid var(--hair);background:var(--slip);padding:10px}
  .board-insp h4{font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px;color:var(--bottle)}
  .board-insp .field{margin-bottom:9px}
  .board-insp input,.board-insp select{width:100%}
  .btnrow{display:flex;gap:5px;flex-wrap:wrap}
  .btnrow button{flex:1;font-size:10px;padding:5px 4px}

  /* storyboard sheet */
  .sb-sheet{margin-top:4px}
  .sb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .sb-panel{display:flex;flex-direction:column;gap:5px}
  .sb-head{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
  .sb-head b{font-family:var(--disp);font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--ink)}
  .sb-frame{aspect-ratio:16/9;border:1px solid var(--ink);background:var(--chipbg);overflow:hidden;position:relative;cursor:pointer;padding:0;width:100%;display:block}
  .sb-frame img,.sb-frame svg{width:100%;height:100%;object-fit:cover;display:block}
  .sb-frame:hover{border-color:var(--brass)}
  .sb-frame .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
  .sb-cap{border:1px solid var(--hair);background:var(--slip);min-height:62px;padding:6px 7px;display:flex;flex-direction:column;gap:4px}
  .sb-cap textarea{flex:1;border:0;background:none;resize:none;font-family:var(--mono);font-size:11.5px;line-height:1.4;padding:0;min-height:34px}
  .sb-cap .meta{font-size:9px;letter-spacing:.08em;color:var(--steel);border-top:1px dotted var(--hair);padding-top:4px}
  .sb-tools{display:flex;gap:4px}
  .sb-tools button{flex:1;font-size:9px;padding:4px 0;border-color:var(--hair);color:var(--steel);letter-spacing:.06em}
  .sb-tools button:hover{background:var(--bottle);color:var(--slip);border-color:var(--bottle)}
  .sb-add{border:1px dashed var(--hair);color:var(--brass);aspect-ratio:16/9;width:100%;font-size:11px}
  @media (max-width:1000px){.sb-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.sb-grid{grid-template-columns:1fr}}

  /* animatic player */
  .player{position:fixed;inset:0;background:#0C0F10;z-index:35;display:flex;flex-direction:column}
  .pl-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px}
  .pl-frame{position:relative;width:min(96vw,calc((100vh - 150px)*16/9));aspect-ratio:16/9;background:#000;border:1px solid #3A403C;overflow:hidden}
  .pl-frame img,.pl-frame svg{width:100%;height:100%;object-fit:contain;display:block}
  .pl-card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#79837E}
  .pl-card .big{font-family:var(--disp);font-size:clamp(30px,6vw,64px);font-weight:600;color:#DFE2DC;letter-spacing:.04em;text-transform:uppercase}
  .pl-card .sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .pl-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(12,15,16,.88));color:#DFE2DC;padding:26px 14px 10px;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
  .pl-cap b{font-family:var(--disp);font-size:17px;font-weight:500;letter-spacing:.06em}
  .pl-cap .dim{color:#9AA39B}
  .pl-bar{background:#14181A;border-top:1px solid #3A403C;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .pl-bar button{color:#DFE2DC;border-color:#79837E}
  .pl-bar button:hover{background:#DFE2DC;color:#14181A}
  .pl-prog{flex:1;display:flex;gap:3px;min-width:160px}
  .seg{flex:1;height:8px;background:#3A403C;position:relative;cursor:pointer;border:0;padding:0;min-width:4px}
  .seg:hover{background:#79837E}
  .seg .fillbar{position:absolute;inset:0;width:0;background:var(--brass)}
  .seg.past .fillbar{width:100%}
  .pl-count{color:#9AA39B;font-size:11px;letter-spacing:.1em;min-width:90px;text-align:right}

  @media (max-width:860px){
    .line1{grid-template-columns:40px repeat(3,1fr)}
    .slot{font-size:18px}
    .stats{gap:12px;font-size:10px}
    .palette,.inspector,.board-pal,.board-insp{width:100%;max-height:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    .stats,.tabs,.rail-shell,.icon,.scene-bar button,.projbar,.palette,.inspector,.tab.add,.modes,.framewrap .mini{display:none!important}
    body{background:#fff}.slip{break-inside:avoid}
    input,select{border:0;background:none;padding:0}
  }
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>Lens<span>·</span>Rail</h1>
      <div class="tagline">Shot list, ordered by glass</div>
    </div>
    <div class="spacer"></div>
    <div class="slate">
      <div class="field"><label for="p-cam">Camera</label><input id="p-cam" placeholder="Body" style="width:130px"></div>
      <div class="field"><label for="p-fmt">Sensor</label><select id="p-fmt"></select></div>
      <div class="field"><label for="p-kit">Lens kit (mm)</label><input id="p-kit" style="width:170px" placeholder="28-70 → 28, 35×1.6 Sirui, 58 Helios, 50"></div>
    </div>
  </header>

  <div class="projbar">
    <select id="proj-pick" title="Switch film"></select>
    <input id="proj-title" placeholder="Film title" style="width:180px">
    <button id="proj-new">+ New film</button>
    <button id="proj-del" class="ghost">Delete film</button>
    <div style="flex:1"></div>
    <div class="live off" id="live"><span class="pip"></span><span id="live-txt">Private</span></div>
    <button id="btn-share">Share for editing</button>
    <button id="btn-join" class="ghost">Join a film</button>
  </div>

  <section class="rail-shell">
    <div class="rail-head"><h2>Lens rail</h2><div class="rail-note" id="rail-note"></div></div>
    <div class="rail" id="rail"></div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <div id="scene-bar"></div>
  <div id="body"></div>
</div>

<footer class="stats">
  <div class="s"><b id="st-shots">0</b> shots</div>
  <div class="s"><b id="st-left">0</b> to go</div>
  <div class="s"><b id="st-time">0h</b> setup</div>
  <div class="s"><b id="st-swaps">0</b> lens changes</div>
  <div class="push">
    <button id="btn-dark" title="Low-glare palette for a dim set">Set mode</button>
    <button id="btn-play">▶ Play film</button>
    <button id="btn-pdf">Export PDF</button>
    <button id="btn-csv">CSV</button>
    <button id="btn-print">Print</button>
  </div>
</footer>

<script>
/* ================= optics ================= */
const FORMATS={
  ff:{n:"Full frame 36×24",w:36,h:24,coc:0.029},
  s35:{n:"Super 35 24.9×18.7",w:24.89,h:18.66,coc:0.019},
  s35open:{n:"S35 open gate 28.25×18.17",w:28.25,h:18.17,coc:0.020},
  apsc:{n:"APS-C 23.6×15.6",w:23.6,h:15.6,coc:0.019},
  mft:{n:"Micro four thirds 17.3×13",w:17.3,h:13,coc:0.015},
  s16:{n:"Super 16 12.5×7.4",w:12.52,h:7.41,coc:0.011},

const fmt=()=>FORMATS[P.format]||FORMATS.ff;
function aov(f){const F=fmt();return{h:2*Math.atan(F.w/(2*f))*180/Math.PI,v:2*Math.atan(F.h/(2*f))*180/Math.PI};}
const frameWidth=(f,d)=>d*(fmt().w/f);
function dof(f,N,dM){
  const c=fmt().coc,s=dM*1000,Nn=parseFloat(N);
  const H=(f*f)/(Nn*c)+f;
  const near=s*(H-f)/(H+s-2*f);
  const far=(s>=H)?Infinity:s*(H-f)/(H-s);
  return{near:near/1000,far:far/1000,total:(far-near)/1000,hyper:H/1000};
}

function aovShot(s){

}

function deliveredRatio(s){

}

function lensDefs(){
  /* kit syntax: "35, 50 Helios, 35x1.6 Sirui ana, 85" — focal, optional x/×squeeze, optional name */
  const defs=[];
  String(P.kit||"").split(",").forEach(tok=>{
    const mch=tok.trim().match(/^([\d.]+)\s*(?:[x×]\s*([\d.]+))?\s*(.*)$/);
    if(!mch)return;
    const mm=parseFloat(mch[1]);if(!(mm>0))return;
    const sq=parseFloat(mch[2])||1;
    const name=(mch[3]||"").trim();
    const label=mm+"mm"+(sq!==1?" ×"+sq:"")+(name?" "+name:"");
    if(!defs.find(d=>d.mm===mm&&d.sq===sq))defs.push({mm,sq,name,label});
  });
  allShots().forEach(o=>{
    const mm=+o.shot.lens,sq=+o.shot.sq||1;
    if(!defs.find(d=>d.mm===mm&&d.sq===sq))defs.push({mm,sq,name:"",label:mm+"mm"+(sq!==1?" ×"+sq:"")});
  });
  return defs.sort((a,b)=>a.mm-b.mm||a.sq-b.sq);
}
function lenses(){return[...new Set(lensDefs().map(d=>d.mm))].sort((a,b)=>a-b);}

/* ================= auto-detect: lens from EXIF, size from faces ================= */
function readExifFocal(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const v=new DataView(r.result);
        if(v.getUint16(0)!==0xFFD8)return res(null); /* not JPEG */
        let off=2;
        while(off<v.byteLength-4){
          if(v.getUint8(off)!==0xFF)break;
          const marker=v.getUint8(off+1),len=v.getUint16(off+2);
          if(marker===0xE1&&v.getUint32(off+4)===0x45786966){ /* "Exif" */
            const tiff=off+10;
            const little=v.getUint16(tiff)===0x4949;
            const u16=p=>v.getUint16(p,little),u32=p=>v.getUint32(p,little);
            const ifd0=tiff+u32(tiff+4);
            let exifPtr=0,n=u16(ifd0);
            for(let i=0;i<n;i++){
              const e=ifd0+2+i*12;
              if(u16(e)===0x8769){exifPtr=u32(e+8);break;}
            }
            if(!exifPtr)return res(null);
            const ex=tiff+exifPtr;let focal=null,equiv=null;
            n=u16(ex);
            for(let i=0;i<n;i++){
              const e=ex+2+i*12,tag=u16(e);
              if(tag===0x920A){const p=tiff+u32(e+8);const num=u32(p),den=u32(p+4);if(den)focal=num/den;}
              if(tag===0xA405){equiv=u16(e+8);}
            }
            return res({focal,equiv});
          }
          off+=2+len;
        }
      }catch(e){}
      res(null);
    };
    r.onerror=()=>res(null);
    r.readAsArrayBuffer(file.slice(0,256*1024));
  });
}
function sizeFromFaceRatio(ratio){
  if(ratio>0.50)return"ECU";
  if(ratio>0.34)return"CU";
  if(ratio>0.22)return"MCU";
  if(ratio>0.12)return"MS";
  if(ratio>0.06)return"MWS";
  return"WS";
}
async function detectShotSize(dataURL){
  if(!("FaceDetector"in window))return null;
  try{
    const im=new Image();
    await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=dataURL;});
    const faces=await new FaceDetector({maxDetectedFaces:5}).detect(im);
    if(!faces.length)return{size:null,faces:0};
    const tallest=Math.max(...faces.map(f=>f.boundingBox.height));
    return{size:sizeFromFaceRatio(tallest/im.height),faces:faces.length};
  }catch(e){return null;}
}
async function autoRead(shot,file,dataURL){
  const notes=[];
  const exif=await readExifFocal(file);
  if(exif&&(exif.equiv||exif.focal)){
    /* prefer the full-frame-equivalent tag; fall back to raw focal */
    const ffEquiv=exif.equiv||exif.focal;
    /* convert FF-equivalent to an actual focal on the project's sensor */
    const target=ffEquiv*(fmt().w/36);
    const L=lenses();
    const nearest=L.reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a,L[0]);
    shot.lens=nearest;
    notes.push((exif.equiv?ffEquiv+"mm (FF equiv)":exif.focal.toFixed(0)+"mm")+" in EXIF → set to "+nearest+"mm");
  }
  const det=await detectShotSize(dataURL);
  if(det&&det.size){
    shot.size=det.faces>1&&(det.size==="MS"||det.size==="MWS"||det.size==="MCU")?"2S":det.size;
    notes.push("framing reads as "+shot.size+(det.faces>1?" ("+det.faces+" faces)":""));
  }
  return notes;
}

function downscale(file,maxW=1000){

    const r=new FileReader();
    r.onload=()=>{const im=new Image();
      im.onload=()=>{const sc=Math.min(1,maxW/im.width),c=document.createElement("canvas");
        c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72));};
      im.onerror=()=>rej(new Error("Could not read that image"));im.src=r.result;};
    r.onerror=()=>rej(new Error("Could not read that file"));r.readAsDataURL(file);
  });
}
async function attachImage(shot,file){
  try{
    const data=await downscale(file),key="lensrail:img:"+uid();
    IMG[key]=data;try{await sSet(key,data,!!P.shared);}catch(e){}
    shot.img=key;shot.board=null;
    const notes=await autoRead(shot,file,data);
    save();render();
    toast(notes.length?"Frame added — "+notes.join(" · "):"Frame added to shot");
  }catch(e){toast(e.message);}
}
async function fetchImage(key){
  if(IMG[key]!==undefined)return IMG[key];
  try{IMG[key]=await sGet(key,!!P.shared);}catch(e){IMG[key]=null;}
  return IMG[key];
}

function boardItemMarkup(it,sel){
  const a=LIB[it.type];if(!a)return"";
  const fill=it.bgDark?"#F1F2ED":"#14181A";

  if(a.text){
    inner='<text y="8" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-size="30" letter-spacing="2" fill="'+fill+'">'+
      String(it.text||"CAPTION").replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text>';
  }else{
    inner=a.d.split(INKED).join(fill);
  }
  const flip=it.flip?" scale(-1,1)":"";
  return '<g transform="translate('+it.x+','+it.y+') rotate('+it.rot+') scale('+it.s+')'+flip+'">'+inner+
    (sel?'<rect class="b-hull" x="-55" y="-55" width="110" height="110" fill="none" stroke="#A2761F" stroke-width="3" vector-effect="non-scaling-stroke"/>':'')+'</g>';

function boardMarkup(board,withSel){
  const dark=board.bg==="night";
  let s='<rect width="'+BW+'" height="'+BH+'" fill="'+(dark?"#2A2F2C":"#FFFFFF")+'"/>';
  if(board.thirds){
    const st=dark?"#79837E":"#C3C8C0";
    s+='<g stroke="'+st+'" stroke-width="1" stroke-dasharray="6 6">'+
      '<line x1="'+BW/3+'" y1="0" x2="'+BW/3+'" y2="'+BH+'"/><line x1="'+2*BW/3+'" y1="0" x2="'+2*BW/3+'" y2="'+BH+'"/>'+
      '<line x1="0" y1="'+BH/3+'" x2="'+BW+'" y2="'+BH/3+'"/><line x1="0" y1="'+2*BH/3+'" x2="'+BW+'" y2="'+2*BH/3+'"/></g>';
  }
  board.items.forEach(it=>{it.bgDark=dark;s+=boardItemMarkup(it,withSel&&it.id===boardSel);});

function boardSVGString(board){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+BW+' '+BH+'">'+boardMarkup(board,false)+'</svg>';
}
function svgToPNG(str,w,h){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      res(c.toDataURL("image/jpeg",.85));};
    im.onerror=()=>res(null);
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str);
  });
}

    g.addEventListener("pointerup",stop);g.addEventListener("pointercancel",stop);

    sc.appendChild(sr);insp.appendChild(sc);
    const row1=el("div","btnrow");
    const flip=el("button",null,it.flip?"Unflip":"Flip");flip.onclick=()=>{it.flip=!it.flip;drawBoard();};
    const fwd=el("button",null,"Front");fwd.onclick=()=>{const i=b.items.indexOf(it);if(i<b.items.length-1){b.items.splice(i,1);b.items.push(it);drawBoard();}};
    const bck=el("button",null,"Back");bck.onclick=()=>{const i=b.items.indexOf(it);if(i>0){b.items.splice(i,1);b.items.unshift(it);drawBoard();}};
    row1.append(flip,fwd,bck);insp.appendChild(row1);
    const row2=el("div","btnrow");row2.style.marginTop="6px";
    const dup=el("button",null,"Duplicate");dup.onclick=()=>{const c=Object.assign({},it,{id:uid(),x:it.x+40,y:it.y+40});b.items.push(c);boardSel=c.id;drawBoard();};
    const del=el("button","ghost","Delete");del.onclick=()=>{b.items.splice(b.items.indexOf(it),1);boardSel=null;drawBoard();};
    row2.append(dup,del);insp.appendChild(row2);
  }
  insp.appendChild(el("div","legend","The frame is 16:9. Whatever is here shows on the shot slip and goes into the PDF."));
  body.appendChild(insp);
  box.appendChild(body);

  function refreshStage(){
    const g=[...s.querySelectorAll("g")].filter(x=>x.parentNode===s)[b.items.indexOf(it)];
    if(g)g.setAttribute("transform","translate("+it.x+","+it.y+") rotate("+it.rot+") scale("+it.s+")"+(it.flip?" scale(-1,1)":""));
    if(asset&&asset.text&&g){const t=g.querySelector("text");if(t)t.textContent=it.text||"CAPTION";}
    lastTouch=Date.now();
  }
}

    :(saved>0?"List order costs "+swaps()+" lens changes. Grouped by lens it would cost "+Math.max(0,uniq-1)+" — <b>"+saved+" fewer swaps</b>."

function readout(s,sc){
  const r=el("div","readout"),a=aovShot(s),fw=frameWidthShot(s),D=dof(+s.lens,s.stop,+s.dist);
  const chip=(t,w)=>{const c=el("div","chip"+(w?" warn":""));c.innerHTML=t;return c;};
  r.appendChild(chip("<b>"+a.h.toFixed(0)+"°</b> h · "+a.v.toFixed(0)+"° v"));
  if((+s.sq||1)!==1)r.appendChild(chip("ana ×"+s.sq+" → <b>"+deliveredRatio(s)+"</b>"));
  r.appendChild(chip("frame <b>"+m(fw)+" m</b> wide"));
  r.appendChild(chip("focus "+m(D.near)+"–"+(D.far===Infinity?"∞":m(D.far))+" m"));
  r.appendChild(chip("depth <b>"+(D.far===Infinity?"∞":m(D.total)+" m")+"</b>",D.total<0.15));
  /* ghost coverage: same spot on neighbouring glass */
  const defs=lensDefs(),i=defs.findIndex(d=>d.mm===+s.lens&&d.sq===(+s.sq||1));
  const ghosts=[defs[i-1],defs[i+1]].filter(Boolean)
    .map(d=>d.label.split(" ")[0]+"→"+m((+s.dist)*(fmt().w*d.sq/d.mm))+"m");
  if(ghosts.length)r.appendChild(chip("here on "+ghosts.join(" · ")));
  /* continuity check against matched slot */
  if(sc&&s.match){
    const other=sc.shots[parseInt(s.match)-1];
    if(other&&other!==s){
      const diffs=[];
      if(+other.lens!==+s.lens||(+other.sq||1)!==(+s.sq||1))diffs.push("lens");
      if(other.stop!==s.stop)diffs.push("T-stop");
      if(+other.iso!==+s.iso)diffs.push("ISO");
      if(+other.wb!==+s.wb)diffs.push("WB");
      if(String(other.shutter)!==String(s.shutter))diffs.push("shutter");
      r.appendChild(diffs.length
        ?chip("≠ shot "+s.match+": "+diffs.join(", "),true)
        :chip("matches shot "+s.match+" ✓"));
    }else if(s.match){r.appendChild(chip("match target "+s.match+" not found",true));}
  }
  if(+s.fps!==25)r.appendChild(chip(s.fps+" fps"));
  return r;
}

/* ================= lighting plan ================= */
let planSvg=null;
function addItem(key){
  const k=KIT[key],sc=P.scenes[active];
  const it={id:uid(),type:key,x:PLAN_W/2,y:PLAN_H/2,rot:k.kind==="light"?90:0,w:k.w,h:k.h,label:k.label};
  if(k.kind==="light"){it.throw=k.throw;it.spread=k.spread;it.note="";}
  if(k.kind==="camera"){it.lens=+(lenses()[0]||35);}
  sc.plan.push(it);selItem=it.id;save();render();
}
function planItemNode(it){
  const k=KIT[it.type]||KIT.table;
  const g=svg("g",{class:"item"+(selItem===it.id?" sel":""),transform:"translate("+it.x+","+it.y+") rotate("+it.rot+")"});
  if(k.kind==="light"){
    const sp=it.spread||45,th=it.throw||300;
    if(sp>=350){g.appendChild(svg("circle",{r:th,fill:k.fill,"fill-opacity":".16"}));}
    else{
      const a=sp*Math.PI/360;
      const x1=th*Math.cos(-a),y1=th*Math.sin(-a),x2=th*Math.cos(a),y2=th*Math.sin(a);
      g.appendChild(svg("path",{d:"M0 0 L"+x1+" "+y1+" A"+th+" "+th+" 0 0 1 "+x2+" "+y2+" Z",fill:k.fill,"fill-opacity":".22",stroke:k.fill,"stroke-opacity":".5","stroke-width":2}));
    }
  }
  if(k.kind==="camera"){
    const a=aov(+(it.lens||35)).h*Math.PI/360,th=800;
    const x1=th*Math.cos(-a),y1=th*Math.sin(-a),x2=th*Math.cos(a),y2=th*Math.sin(a);
    g.appendChild(svg("path",{d:"M0 0 L"+x1+" "+y1+" A"+th+" "+th+" 0 0 1 "+x2+" "+y2+" Z",fill:"#14181A","fill-opacity":".10",stroke:"#14181A","stroke-opacity":".45","stroke-width":2,"stroke-dasharray":"10 8"}));
  }
  const hull=svg(k.kind==="light"||k.kind==="actor"?"circle":"rect",
    k.kind==="light"||k.kind==="actor"
      ?{r:it.w/2,fill:k.fill,stroke:"#14181A","stroke-width":2,class:"hull"}
      :{x:-it.w/2,y:-it.h/2,width:it.w,height:it.h,fill:k.fill,stroke:"#14181A","stroke-width":2,class:"hull"});
  g.appendChild(hull);
  if(k.kind==="camera")g.appendChild(svg("path",{d:"M"+(it.w/2)+" 0 L"+(it.w/2-22)+" -14 L"+(it.w/2-22)+" 14 Z",fill:"#F1F2ED"}));
  if(k.kind==="actor")g.appendChild(svg("circle",{cx:it.w/2-6,cy:0,r:5,fill:"#F1F2ED"}));
  const lab=svg("text",{y:-(Math.max(it.h,it.w)/2)-10,"text-anchor":"middle","font-family":"IBM Plex Mono, monospace","font-size":"26",fill:"#14181A",transform:"rotate("+(-it.rot)+")"});
  lab.textContent=it.label;g.appendChild(lab);
  let drag=null;
  g.addEventListener("pointerdown",e=>{
    e.preventDefault();selItem=it.id;g.setPointerCapture(e.pointerId);
    const p=toPlan(e);drag={dx:p.x-it.x,dy:p.y-it.y};render();
  });
  g.addEventListener("pointermove",e=>{
    if(!drag)return;
    const p=toPlan(e);
    it.x=Math.max(0,Math.min(PLAN_W,Math.round(p.x-drag.dx)));
    it.y=Math.max(0,Math.min(PLAN_H,Math.round(p.y-drag.dy)));
    g.setAttribute("transform","translate("+it.x+","+it.y+") rotate("+it.rot+")");
    lastTouch=Date.now();
  });
  const stop=()=>{if(drag){drag=null;save();}};
  g.addEventListener("pointerup",stop);g.addEventListener("pointercancel",stop);
  return g;
}
function toPlan(e){const pt=planSvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(planSvg.getScreenCTM().inverse());}
function buildPlanSVG(sc,interactive){
  const s=svg("svg",{class:"plan",viewBox:"0 0 "+PLAN_W+" "+PLAN_H,preserveAspectRatio:"xMidYMid meet",xmlns:"http://www.w3.org/2000/svg"});
  const defs=svg("defs");
  const pat=svg("pattern",{id:"grid",width:100,height:100,patternUnits:"userSpaceOnUse"});
  pat.appendChild(svg("path",{d:"M100 0 L0 0 0 100",fill:"none",stroke:"#C3C8C0","stroke-width":1.5}));
  defs.appendChild(pat);s.appendChild(defs);
  s.appendChild(svg("rect",{width:PLAN_W,height:PLAN_H,fill:"#F1F2ED"}));
  s.appendChild(svg("rect",{width:PLAN_W,height:PLAN_H,fill:"url(#grid)"}));
  if(interactive){
    planSvg=s;
    s.addEventListener("pointerdown",e=>{if(e.target.tagName==="rect"&&e.target.parentNode===s){selItem=null;render();}});
    (sc.plan||[]).forEach(it=>s.appendChild(planItemNode(it)));
  }else{
    const keep=selItem;selItem=null;
    const hold=planSvg;
    (sc.plan||[]).forEach(it=>s.appendChild(planItemNode(it)));
    selItem=keep;planSvg=hold;
  }
  return s;
}
function renderPlan(){
  const sc=P.scenes[active],body=$("#body");body.innerHTML="";
  const shell=el("div","plan-shell");
  const pal=el("div","palette");
  ["Camera","Light","Grip","Set"].forEach(group=>{
    pal.appendChild(el("h4",null,group));

    Object.entries(KIT).filter(([,v])=>v.g===group).forEach(([key,v])=>{

    });

  const leg=el("div","legend");
  leg.innerHTML='<div><span style="background:#E9B949"></span>Beam cones show throw and spread</div>'+
                '<div><span style="background:#14181A"></span>Camera cone uses its real angle of view</div>'+
                '<div>Grid square = 1 m · plan is 16 × 10 m</div>';
  pal.appendChild(leg);shell.appendChild(pal);
  const stage=el("div","stage");
  stage.appendChild(buildPlanSVG(sc,true));
  shell.appendChild(stage);
  const insp=el("div","inspector");

  }else{
    const k=KIT[it.type];
    insp.appendChild(el("h4",null,k.label));
    insp.appendChild(txtField("Label",it.label,v=>{it.label=v;save();renderPlan();}));
    const rot=el("div","field");rot.appendChild(el("label",null,"Rotation "+it.rot+"°"));
    const r=el("input");r.type="range";r.min=0;r.max=359;r.value=it.rot;
    r.oninput=e=>{it.rot=+e.target.value;lastTouch=Date.now();renderPlan();};
    r.onchange=()=>save();
    rot.appendChild(r);insp.appendChild(rot);
    if(k.kind==="light"){
      insp.appendChild(numField("Throw (cm)",it.throw,"20",v=>{it.throw=v;save();renderPlan();}));
      insp.appendChild(numField("Spread (°)",it.spread,"5",v=>{it.spread=v;save();renderPlan();}));
      insp.appendChild(txtField("Gel / diffusion / note",it.note||"",v=>{it.note=v;save();}));
    }
    if(k.kind==="camera"){
      insp.appendChild(selField("Lens mm",it.lens,lenses(),v=>{it.lens=+v;save();renderPlan();}));
      insp.appendChild(el("div","legend","Cone drawn at "+aov(+it.lens).h.toFixed(0)+"° horizontal on "+fmt().n+"."));
    }
    if(k.kind!=="light"&&k.kind!=="actor"){
      insp.appendChild(numField("Width (cm)",it.w,"5",v=>{it.w=v;save();renderPlan();}));
      insp.appendChild(numField("Depth (cm)",it.h,"5",v=>{it.h=v;save();renderPlan();}));
    }else{
      insp.appendChild(numField("Size (cm)",it.w,"5",v=>{it.w=v;it.h=v;save();renderPlan();}));
    }
    const row=el("div");row.style.display="flex";row.style.gap="6px";
    const dup=el("button",null,"Duplicate");
    dup.onclick=()=>{const c=Object.assign({},it,{id:uid(),x:it.x+60,y:it.y+60});sc.plan.push(c);selItem=c.id;save();renderPlan();};
    const rm=el("button","ghost","Delete");
    rm.onclick=()=>{sc.plan.splice(sc.plan.indexOf(it),1);selItem=null;save();renderPlan();};
    row.append(dup,rm);insp.appendChild(row);
  }
  shell.appendChild(insp);
  body.appendChild(shell);
}

/* ================= animatic player ================= */
function openPlayer(list,title){
  if(!list.length){toast("Nothing to play yet");return;}
  closePlayer();
  player={list,title,i:0,playing:true,t0:0,elapsed:0,raf:null};
  const root=el("div","player");root.id="player";
  root.innerHTML=
    '<div class="pl-stage"><div class="pl-frame" id="pl-frame"></div></div>'+
    '<div class="pl-bar">'+
      '<button id="pl-prev" title="Previous shot (←)">⏮</button>'+
      '<button id="pl-toggle" title="Play / pause (space)">⏸</button>'+
      '<button id="pl-next" title="Next shot (→)">⏭</button>'+
      '<div class="pl-prog" id="pl-prog"></div>'+
      '<div class="pl-count" id="pl-count"></div>'+
      '<button id="pl-close" title="Close (Esc)">✕ Close</button>'+
    '</div>';
  document.body.appendChild(root);
  $("#pl-prev").onclick=()=>seek(player.i-1);
  $("#pl-next").onclick=()=>seek(player.i+1);
  $("#pl-toggle").onclick=togglePlay;
  $("#pl-close").onclick=closePlayer;
  buildProg();
  showShot(0);
  tick();
}
function closePlayer(){
  if(player&&player.raf)cancelAnimationFrame(player.raf);
  const r=$("#player");if(r)r.remove();
  player=null;
}
function shotDur(s){return Math.max(0.5,+s.sec||3)*1000;}
function buildProg(){
  const p=$("#pl-prog");p.innerHTML="";
  player.list.forEach((o,idx)=>{
    const seg=el("button","seg");
    seg.style.flexGrow=String(Math.max(0.5,+o.shot.sec||3));
    seg.title="Shot "+(idx+1)+" — "+(o.shot.desc||o.shot.size);
    seg.appendChild(el("div","fillbar"));
    seg.onclick=()=>seek(idx);
    p.appendChild(seg);
  });
}
function seek(i){
  if(!player)return;
  player.i=Math.max(0,Math.min(player.list.length-1,i));
  player.elapsed=0;player.t0=performance.now();
  showShot(player.i);
}
function togglePlay(){
  if(!player)return;
  player.playing=!player.playing;
  if(player.playing)player.t0=performance.now()-player.elapsed;
  $("#pl-toggle").textContent=player.playing?"⏸":"▶";
}
async function showShot(i){
  if(!player)return;
  const o=player.list[i],s=o.shot;
  const f=$("#pl-frame");if(!f)return;
  let inner="";
  if(s.img){
    const d=await fetchImage(s.img);
    if(!player||player.i!==i)return;
    inner=d?'<img src="'+d+'" alt="">':"";
  }else if(s.board&&s.board.items.length){
    inner='<svg viewBox="0 0 '+BW+' '+BH+'">'+boardMarkup(s.board,false)+'</svg>';
  }
  if(!inner){
    inner='<div class="pl-card"><div class="big">'+s.size+' · '+s.lens+'mm</div>'+
      '<div class="sub">'+s.angle+' · '+s.move+'</div>'+
      '<div class="sub" style="max-width:70%;text-align:center;text-transform:none;letter-spacing:.02em">'+
      String(s.desc||"No frame drawn yet").replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</div></div>';
  }
  const cap='<div class="pl-cap"><b>'+(i+1)+' / '+player.list.length+'</b>'+
    '<span>'+s.size+' · '+s.lens+'mm'+((+s.sq||1)!==1?' ×'+s.sq:'')+' · T'+s.stop+'</span>'+
    '<span class="dim">'+s.angle+' · '+s.move+(s.filter?' · '+s.filter:'')+'</span>'+
    '<span class="dim" style="flex:1;text-align:right">'+String(o.scene.name).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span></div>';
  f.innerHTML=inner+cap;
  [...document.querySelectorAll(".seg")].forEach((seg,idx)=>{
    seg.classList.toggle("past",idx<i);
    if(idx>=i)seg.classList.remove("past");
    seg.querySelector(".fillbar").style.width=idx<i?"100%":"0";
  });
  const c=$("#pl-count");if(c)c.textContent=player.title;
  player.t0=performance.now();player.elapsed=0;
}
function tick(){
  if(!player)return;
  if(player.playing){
    player.elapsed=performance.now()-player.t0;
    const dur=shotDur(player.list[player.i].shot);
    const seg=[...document.querySelectorAll(".seg")][player.i];
    if(seg)seg.querySelector(".fillbar").style.width=Math.min(100,player.elapsed/dur*100)+"%";
    if(player.elapsed>=dur){
      if(player.i<player.list.length-1)seek(player.i+1);
      else{player.playing=false;$("#pl-toggle").textContent="▶";}
    }
  }
  player.raf=requestAnimationFrame(tick);
}

/* ================= stats + exports ================= */
function renderStats(){
  const all=allShots(),left=all.filter(o=>!o.shot.done);
  const mins=left.reduce((t,o)=>t+(+o.shot.mins||0),0);
  $("#st-shots").textContent=all.length;
  $("#st-left").textContent=left.length;
  $("#st-time").textContent=Math.floor(mins/60)+"h "+(mins%60)+"m";
  $("#st-swaps").textContent=swaps();
}
function csv(){
  const rows=[["Scene","Slot","Size","Angle","Move","Lens mm","T-stop","Dist m","H AoV","DoF near","DoF far","FPS","Filter","Set-up min","Shot?","Frame","Description"]];
  allShots().forEach(o=>{
    const s=o.shot,D=dof(+s.lens,s.stop,+s.dist);
    rows.push([o.scene.name,o.scene.shots.indexOf(s)+1,s.size,s.angle,s.move,s.lens,"T"+s.stop,s.dist,
      aov(+s.lens).h.toFixed(1)+"deg",m(D.near),D.far===Infinity?"inf":m(D.far),s.fps,s.filter,s.mins,s.done?"yes":"no",s.img?"photo":(s.board&&s.board.items.length?"board":""),s.desc]);
  });
  P.scenes.forEach(sc=>(sc.plan||[]).forEach(it=>{
    rows.push([sc.name,"PLAN",KIT[it.type].label,it.label,"rot "+it.rot+"°","","",(it.x/100).toFixed(1)+" / "+(it.y/100).toFixed(1)+" m",
      it.throw?("throw "+(it.throw/100).toFixed(1)+"m"):"",it.spread?(it.spread+"°"):"","","",it.note||"","","","",""]);
  }));
  const out=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));
  a.download=((P.title||"shotlist").replace(/\s+/g,"-").toLowerCase())+".csv";
  a.click();toast("CSV exported");
}

async function shotThumb(s){
  if(s.img){const d=await fetchImage(s.img);return d||null;}
  if(s.board&&s.board.items.length)return svgToPNG(boardSVGString(s.board),480,270);
  return null;
}
function planPNG(sc){
  if(!(sc.plan||[]).length)return Promise.resolve(null);
  const node=buildPlanSVG(sc,false);
  const str=new XMLSerializer().serializeToString(node);
  return svgToPNG(str,800,500);
}
async function exportPDF(){
  if(!window.jspdf){toast("PDF library did not load — check your connection");return;}
  toast("Building the PDF…");
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const PW=210,MARG=14,CW=PW-2*MARG;
  let y=MARG;
  const line=(txt,size,style,color)=>{
    doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
    doc.setTextColor(color?color[0]:20,color?color[1]:24,color?color[2]:26);
    const wrapped=doc.splitTextToSize(String(txt),CW);
    wrapped.forEach(w=>{checkPage(size*0.45);doc.text(w,MARG,y);y+=size*0.45;});
  };
  const checkPage=need=>{if(y+need>283){doc.addPage();y=MARG;}};

  /* title page */
  doc.setFont("helvetica","bold");doc.setFontSize(28);doc.setTextColor(20,24,26);
  doc.text((P.title||"Untitled film").toUpperCase(),MARG,40);
  doc.setFontSize(11);doc.setFont("helvetica","normal");doc.setTextColor(121,131,126);
  doc.text("Shot list & lighting plans — Lens Rail",MARG,48);
  doc.setTextColor(20,24,26);doc.setFontSize(10);
  const all=allShots();
  const meta=[
    "Camera: "+(P.camera||"—")+"   Sensor: "+fmt().n,
    "Lens kit: "+lensDefs().map(d=>d.label).join(" / "),
    "Scenes: "+P.scenes.length+"   Shots: "+all.length+"   Completed: "+all.filter(o=>o.shot.done).length,
    "Exported: "+new Date().toLocaleDateString()
  ];
  let ty=60;meta.forEach(t=>{doc.text(t,MARG,ty);ty+=6;});
  doc.setDrawColor(162,118,31);doc.setLineWidth(1.2);doc.line(MARG,68+meta.length*2,MARG+60,68+meta.length*2);

  for(const sc of P.scenes){
    doc.addPage();y=MARG;
    doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(29,58,50);
    checkPage(8);doc.text(sc.name.toUpperCase(),MARG,y);y+=8;
    doc.setDrawColor(20,24,26);doc.setLineWidth(.5);doc.line(MARG,y-4,PW-MARG,y-4);y+=2;

    for(let i=0;i<sc.shots.length;i++){
      const s=sc.shots[i],D=dof(+s.lens,s.stop,+s.dist),a=aovShot(s);
      const thumb=await shotThumb(s);
      const blockH=thumb?38:20;
      checkPage(blockH+6);
      const y0=y;
      if(thumb){
        try{doc.addImage(thumb,"JPEG",MARG,y,56,31.5);}catch(e){}
      }
      const tx=thumb?MARG+61:MARG;
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(20,24,26);
      doc.text((i+1)+".  "+s.size+" · "+s.angle+" · "+s.move+(s.done?"   [SHOT]":""),tx,y+5);
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(60,66,63);
      doc.text(s.lens+"mm"+((+s.sq||1)!==1?" x"+s.sq+" ("+deliveredRatio(s)+")":"")+"  T"+s.stop+"  at "+s.dist+"m  ·  "+a.h.toFixed(0)+"deg AoV  ·  ISO "+(s.iso||800)+"  "+(s.shutter||"1/50")+"  "+(s.wb||5600)+"K  ·  focus "+m(D.near)+"-"+(D.far===Infinity?"inf":m(D.far))+"m"+(s.filter?"  ·  "+s.filter:""),tx,y+11);
      const dtxt=doc.splitTextToSize(s.desc||"—",thumb?CW-61:CW);
      doc.setTextColor(20,24,26);
      doc.text(dtxt.slice(0,3),tx,y+17);
      y=y0+blockH;
      doc.setDrawColor(195,200,192);doc.setLineWidth(.2);doc.line(MARG,y-2,PW-MARG,y-2);
    }

    /* storyboard sheet page — 2 across, 3 down, matching the on-screen grid */
    const framed=sc.shots.filter(x=>x.img||(x.board&&x.board.items.length));
    if(framed.length){
      doc.addPage();y=MARG;
      doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(20,24,26);
      doc.text("STORYBOARD — "+sc.name.toUpperCase(),MARG,y+2);y+=10;
      const colW=(CW-6)/2, frH=colW*9/16, capH=15, rowH=5+frH+capH+7;
      for(let i=0;i<sc.shots.length;i++){
        const s2=sc.shots[i];
        const thumb=await shotThumb(s2);
        const col=i%2, row=Math.floor(i/2)%3;
        if(col===0&&row===0&&i>0){doc.addPage();y=MARG;}
        const x0=MARG+col*(colW+6), y0=y+row*rowH;
        doc.setFontSize(7.5);doc.setFont("helvetica","normal");doc.setTextColor(121,131,126);
        doc.text((sc.name.split("—")[0].trim()||"Scene").toUpperCase(),x0,y0+3);
        doc.setFont("helvetica","bold");doc.setTextColor(20,24,26);
        doc.text("SHOT "+(i+1),x0+colW,y0+3,{align:"right"});
        doc.setDrawColor(20,24,26);doc.setLineWidth(.3);
        doc.rect(x0,y0+5,colW,frH);
        if(thumb){try{doc.addImage(thumb,"JPEG",x0+.4,y0+5.4,colW-.8,frH-.8);}catch(e){}}
        doc.setDrawColor(195,200,192);
        doc.rect(x0,y0+5+frH+2,colW,capH);
        doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(20,24,26);
        doc.text(doc.splitTextToSize(s2.desc||"",colW-4).slice(0,3),x0+2,y0+5+frH+7);
        doc.setFontSize(6.5);doc.setTextColor(121,131,126);
        doc.text(s2.size+" · "+s2.lens+"mm"+((+s2.sq||1)!==1?" x"+s2.sq:"")+" · T"+s2.stop+" · "+s2.move,x0+2,y0+5+frH+capH-1);
        if(col===1&&row===2&&i<sc.shots.length-1){doc.addPage();y=MARG;}
      }
      y=283;
    }

    const plan=await planPNG(sc);
    if(plan){
      checkPage(80);
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(29,58,50);
      doc.text("LIGHTING PLAN — 16 × 10 m, grid 1 m",MARG,y+4);y+=8;
      try{doc.addImage(plan,"JPEG",MARG,y,CW,CW*0.625);}catch(e){}
      y+=CW*0.625+4;
      const notes=(sc.plan||[]).filter(it=>it.note).map(it=>it.label+": "+it.note);
      if(notes.length){doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(60,66,63);
        notes.forEach(n=>{checkPage(5);doc.text("· "+n,MARG,y);y+=4.5;});}
    }
  }
  doc.save(((P.title||"shotlist").replace(/\s+/g,"-").toLowerCase())+".pdf");
  toast("PDF saved");
}

/* ================= projects + sharing ================= */
function renderProjBar(){
  const pick=$("#proj-pick");pick.innerHTML="";
  IDX.projects.forEach(p=>{const o=el("option",null,(p.shared?"◈ ":"")+p.title);o.value=p.id;if(p.id===P.id)o.selected=true;pick.appendChild(o);});
  $("#proj-title").value=P.title;
  const live=$("#live");
  live.className="live"+(P.shared?"":" off");
  $("#live-txt").textContent=P.shared?("Shared · "+P.room):"Private";
  $("#btn-share").textContent=P.shared?"Show code":"Share for editing";
}
async function makeShared(){
  if(!window.storage){toast("Sharing needs storage, which is unavailable here");return;}
  if(P.shared){prompt("Send friends this artifact link and the code below. Anyone with both can edit this film.",P.room);return;}
  if(!confirm("Sharing puts this film in shared storage, so anyone you send the link and code to can read and edit it. Continue?"))return;
  P.shared=true;P.room=room();
  for(const key of allShots().map(o=>o.shot.img).filter(Boolean)){
    const d=await fetchImage(key).catch(()=>null);
    if(d){try{await sSet(key,d,true);}catch(e){}}
  }
  await sSet("lensrail:room:"+P.room,P,true);
  const meta=IDX.projects.find(p=>p.id===P.id);if(meta){meta.shared=true;meta.room=P.room;}
  await saveIndex();startPoll();render();
  prompt("Shared. Send friends this artifact link and the code below.",P.room);
}
async function joinShared(){
  const code=(prompt("Enter the code your friend sent you")||"").trim().toUpperCase();
  if(!code)return;
  try{
    const doc=await sGet("lensrail:room:"+code,true);
    if(!doc||!doc.scenes)throw 0;
    if(!IDX.projects.find(p=>p.room===code))IDX.projects.push({id:doc.id,title:doc.title,shared:true,room:code});
    IDX.active=doc.id;await saveIndex();P=doc;active=0;startPoll();render();
    toast("Joined “"+doc.title+"”");
  }catch(e){toast("No film found for that code");}
}

/* ================= render + boot ================= */
function renderHead(){
  $("#p-cam").value=P.camera;$("#p-kit").value=P.kit;
  const f=$("#p-fmt");
  if(!f.options.length)Object.entries(FORMATS).forEach(([k,v])=>{const o=el("option",null,v.n);o.value=k;f.appendChild(o);});
  f.value=P.format;
}
function render(){
  renderHead();renderProjBar();renderRail();renderTabs();renderSceneBar();
  if(mode==="lens")renderLens();else if(mode==="plan")renderPlan();else if(mode==="board")renderSheet();else renderShots();
  renderStats();
  document.title=(P.title||"Lens Rail")+" — shot list";
}

(async function(){
  await loadIndex();
  if(!IDX.projects.length){
    P=newProject("Untitled film");
    IDX.projects.push({id:P.id,title:P.title,shared:false,room:null});
    IDX.active=P.id;await saveIndex();save();
  }else{
    await openProject(IDX.active||IDX.projects[0].id);
  }
  render();
  if(!window.storage)toast("Storage unavailable — this session will not be saved");

  $("#p-cam").oninput=e=>{P.camera=e.target.value;save();};
  $("#p-kit").oninput=e=>{P.kit=e.target.value;save();renderRail();};
  $("#p-fmt").onchange=e=>{P.format=e.target.value;save();render();};
  $("#proj-title").oninput=e=>{P.title=e.target.value;save();renderProjBar();};
  $("#proj-pick").onchange=e=>{mode="shots";openProject(e.target.value);};
  $("#proj-new").onclick=async()=>{
    const np=newProject("Untitled film");
    IDX.projects.push({id:np.id,title:np.title,shared:false,room:null});
    P=np;IDX.active=np.id;active=0;mode="shots";clearInterval(pollTimer);
    await saveIndex();save();render();$("#proj-title").focus();
  };
  $("#proj-del").onclick=async()=>{
    if(IDX.projects.length===1){toast("Keep at least one film");return;}
    if(!confirm("Delete “"+P.title+"” and everything in it?"))return;
    IDX.projects=IDX.projects.filter(p=>p.id!==P.id);
    try{await window.storage.delete(pKey(P),!!P.shared);}catch(e){}
    await saveIndex();await openProject(IDX.projects[0].id);
  };
  $("#btn-share").onclick=makeShared;
  $("#btn-join").onclick=joinShared;
  $("#btn-csv").onclick=csv;
  $("#btn-pdf").onclick=exportPDF;
  $("#btn-print").onclick=()=>window.print();
  $("#btn-play").onclick=()=>openPlayer(allShots(),P.title||"Untitled film");
  document.body.classList.toggle("dark",!!IDX.dark);
  $("#btn-dark").onclick=async()=>{IDX.dark=!IDX.dark;document.body.classList.toggle("dark",!!IDX.dark);await saveIndex();};

  document.addEventListener("paste",e=>{
    if(boardShot)return;
    const items=[...(e.clipboardData?e.clipboardData.items:[])];
    const img=items.find(i=>i.type.startsWith("image/"));
    if(!img)return;
    e.preventDefault();
    const sc=P.scenes[active];
    let target=sc.shots.find(s=>s.id===selShot);
    if(!target){
      if(mode!=="shots"&&mode!=="board"){toast("Open the storyboard or shots view to paste a frame");return;}
      target=newShot();sc.shots.push(target);selShot=target.id;
      toast("New shot created for the pasted frame");
    }
    attachImage(target,img.getAsFile());
  });

  document.addEventListener("keydown",e=>{
    if(player){
      if(e.key==="Escape")closePlayer();
      if(e.key===" "){e.preventDefault();togglePlay();}
      if(e.key==="ArrowRight")seek(player.i+1);
      if(e.key==="ArrowLeft")seek(player.i-1);
      return;
    }
    if(boardShot){
      if(e.key==="Escape")closeBoard();
      if(e.key==="Delete"&&boardSel&&document.activeElement.tagName!=="INPUT"){
        const b=boardShot.board;b.items=b.items.filter(i=>i.id!==boardSel);boardSel=null;drawBoard();
      }
      return;
    }
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&mode==="shots"){
      const sc=P.scenes[active],last=sc.shots[sc.shots.length-1];
      sc.shots.push(newShot(last?{lens:last.lens,stop:last.stop,dist:last.dist}:{}));save();render();
    }
    if(e.key==="Delete"&&mode==="plan"&&selItem&&document.activeElement.tagName!=="INPUT"){
      const sc=P.scenes[active];sc.plan=sc.plan.filter(i=>i.id!==selItem);selItem=null;save();renderPlan();
    }
  });
})();
</script>
